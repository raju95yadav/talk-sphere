version: '3.8'

# ==============================================================================
# TalkSphere Full-Stack Clustered Production Architecture [Phase 6]
# ==============================================================================

networks:
  talksphere-net:
    driver: bridge

volumes:
  redis-data:
  temp-uploads:

services:
  # ============================================================================
  # 1. Reverse Proxy & Sticky Session Load Balancer (Nginx)
  # ============================================================================
  loadbalancer:
    image: nginx:alpine
    container_name: talksphere-loadbalancer
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      backend_1:
        condition: service_healthy
      backend_2:
        condition: service_healthy
      backend_3:
        condition: service_healthy
    networks:
      - talksphere-net

  # ============================================================================
  # 2. Clustered Backend Node.js Replicas (Stateless Instances)
  # ============================================================================
  backend_1:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: talksphere-backend-1
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - PORT=5000
      - INSTANCE_ID=backend-replica-1
      - REDIS_URL=${REDIS_URL:-redis://redis:6379}
      - REDIS_URI=${REDIS_URI:-redis://redis:6379}
      - MONGODB_URI=${MONGODB_URI}
      - JWT_SECRET=${JWT_SECRET}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - TURN_HOST=${TURN_HOST:-coturn}
      - TURN_SHARED_SECRET=${TURN_SHARED_SECRET}
      - TURN_REALM=${TURN_REALM:-turn.talksphere.local}
      - LIVEKIT_URL=${LIVEKIT_URL:-ws://livekit:7880}
      - LIVEKIT_API_KEY=${LIVEKIT_API_KEY}
      - LIVEKIT_API_SECRET=${LIVEKIT_API_SECRET}
    volumes:
      - temp-uploads:/tmp/talksphere-rag-temp
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - talksphere-net

  backend_2:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: talksphere-backend-2
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - PORT=5000
      - INSTANCE_ID=backend-replica-2
      - REDIS_URL=${REDIS_URL:-redis://redis:6379}
      - REDIS_URI=${REDIS_URI:-redis://redis:6379}
      - MONGODB_URI=${MONGODB_URI}
      - JWT_SECRET=${JWT_SECRET}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - TURN_HOST=${TURN_HOST:-coturn}
      - TURN_SHARED_SECRET=${TURN_SHARED_SECRET}
      - TURN_REALM=${TURN_REALM:-turn.talksphere.local}
      - LIVEKIT_URL=${LIVEKIT_URL:-ws://livekit:7880}
      - LIVEKIT_API_KEY=${LIVEKIT_API_KEY}
      - LIVEKIT_API_SECRET=${LIVEKIT_API_SECRET}
    volumes:
      - temp-uploads:/tmp/talksphere-rag-temp
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - talksphere-net

  backend_3:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: talksphere-backend-3
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - PORT=5000
      - INSTANCE_ID=backend-replica-3
      - REDIS_URL=${REDIS_URL:-redis://redis:6379}
      - REDIS_URI=${REDIS_URI:-redis://redis:6379}
      - MONGODB_URI=${MONGODB_URI}
      - JWT_SECRET=${JWT_SECRET}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - TURN_HOST=${TURN_HOST:-coturn}
      - TURN_SHARED_SECRET=${TURN_SHARED_SECRET}
      - TURN_REALM=${TURN_REALM:-turn.talksphere.local}
      - LIVEKIT_URL=${LIVEKIT_URL:-ws://livekit:7880}
      - LIVEKIT_API_KEY=${LIVEKIT_API_KEY}
      - LIVEKIT_API_SECRET=${LIVEKIT_API_SECRET}
    volumes:
      - temp-uploads:/tmp/talksphere-rag-temp
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - talksphere-net

  # ============================================================================
  # 3. Redis Pub/Sub, Presence & Job Queue Broker
  # ============================================================================
  redis:
    image: redis:7-alpine
    container_name: talksphere-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - talksphere-net

  # ============================================================================
  # 4. Coturn NAT Traversal Media Relay [Phase 5]
  # ============================================================================
  coturn:
    image: coturn/coturn:latest
    container_name: talksphere-coturn
    restart: unless-stopped
    volumes:
      - ./docker/turn/turnserver.conf:/etc/coturn/turnserver.conf:ro
    environment:
      - TURN_SHARED_SECRET=${TURN_SHARED_SECRET}
      - TURN_REALM=${TURN_REALM:-turn.talksphere.local}
    command: ["-c", "/etc/coturn/turnserver.conf"]
    networks:
      - talksphere-net

  # ============================================================================
  # 5. LiveKit SFU Multi-Party Media Engine [Phase 5]
  # ============================================================================
  livekit:
    image: livekit/livekit-server:latest
    container_name: talksphere-livekit
    restart: unless-stopped
    volumes:
      - ./docker/livekit/livekit.yaml:/etc/livekit.yaml:ro
    environment:
      - LIVEKIT_KEYS=${LIVEKIT_API_KEY}: ${LIVEKIT_API_SECRET}
    command: ["--config", "/etc/livekit.yaml"]
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - talksphere-net

