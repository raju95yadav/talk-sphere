# ==============================================================================
# Coturn TURN Server Configuration - TalkSphere Production Media Infrastructure
# High-Reliability NAT Traversal & Symmetric Firewall Relay [B-10]
# ==============================================================================

# Network Listening Ports
listening-port=3478
tls-listening-port=5349
alt-listening-port=3479
alt-tls-listening-port=5350

# Relayed Media UDP Port Allocation Range
min-port=49152
max-port=65535

# Security & Protocol Rules
fingerprint
lt-cred-mech
use-auth-secret
static-auth-secret=talksphere_turn_secret_2026_super_secure_key
realm=talksphere.local

# Quotas & Bandwidth Caps (Protection against exhaustion attacks)
total-quota=100
bps-capacity=0
user-quota=12
max-allocate-per-user=10

# Security Hardening
stale-nonce
no-loopback-peers
no-multicast-peers
no-cli

# Logging
verbose
no-stdout-log
log-file=/var/log/turnserver/turnserver.log

