# ==============================================================================
# LiveKit SFU Configuration - TalkSphere Production Multi-Party Video [B-09]
# O(N) Media Forwarding Unit & Simulcast Adaptive Routing
# ==============================================================================

port: 7880
bind_addresses:
  - ""

rtc:
  tcp_port: 7881
  port_range_start: 50000
  port_range_end: 60000
  use_external_ip: true
  enable_loopback_candidate: false

keys: {}

logging:
  json: false
  level: info

room:
  auto_create: true
  empty_timeout: 300
  max_participants: 100

turn:
  enabled: false # Delegated to dedicated Coturn instance

